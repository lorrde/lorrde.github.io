<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozy Focus</title>
<meta name="description" content="Cozy Focus: an 8-bit pixel art Pomodoro timer.">
<style>
  :root { --bg: #2b1d16; --card: #4a3226; --text: #f7ebd3; --muted: #d6c3a8; --accent: #e0a458; --border: #1a110c; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card { width: 100%; max-width: 460px; background: var(--card); border: 4px solid var(--border);
          box-shadow: 6px 6px 0 rgba(0,0,0,.45); padding: 28px 20px; text-align: center; }
  h1 { color: var(--accent); margin: 8px 0; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main class="card">
  <div style="font-size:44px">&#9749;</div>
  <h1>Cozy Focus</h1>
  <p>An 8-bit pixel art Pomodoro timer. Focus in a cozy coffee shop, a rainy cabin or a retro arcade.</p>
  <p><a href="privacy/">Privacy policy</a></p>
</main>
</body>
</html>
